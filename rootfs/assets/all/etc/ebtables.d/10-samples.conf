# =============================================================================
# SAMPLE ebtables rules — uncomment what you need, then run: apply-ebtables
# =============================================================================
#
# Rule ordering matters: rules are checked top to bottom, first match wins.
# The provisioning already installs base rules (gateway access, intra-VLAN drop).
# Additional rules here run AFTER the provisioning rules.
#
# Tips:
#   --ip-src A --ip-dst B = allow traffic from A to B
#   --ip-proto tcp --ip-dport 80 = TCP port 80 (destination)
#   --ip-proto udp --ip-sport 5353 = UDP port 5353 (source)
#   --ip-dst 224.0.0.251 = multicast (used by mDNS)

# =============================================================================
# 1. SIMPLE IP ACCESS
# Allow IOT (10.68.0.0/16) to reach a specific server
# =============================================================================
# -A FORWARD -p IPv4 --ip-src 10.68.0.0/16 --ip-dst 10.68.1.153 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.68.1.153 --ip-dst 10.68.0.0/16 -j ACCEPT

# Allow MEAT (10.60.23.0/24) to reach a printer on port 9100
# -A FORWARD -p IPv4 --ip-src 10.60.23.0/24 --ip-dst 10.60.23.50 --ip-proto tcp --ip-dport 9100 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.60.23.50 --ip-dst 10.60.23.0/24 --ip-proto tcp --ip-sport 9100 -j ACCEPT

# Allow ANONYMOUS (10.60.137.0/24) to reach a media server
# -A FORWARD -p IPv4 --ip-src 10.60.137.0/24 --ip-dst 10.60.137.50 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.60.137.50 --ip-dst 10.60.137.0/24 -j ACCEPT

# =============================================================================
# 2. SOURCE BYPASS
# A trusted client that can talk to anyone on the same VLAN
# =============================================================================
# -A FORWARD -p IPv4 --ip-src 10.68.0.100 --ip-dst 10.68.0.0/16 -j ACCEPT

# =============================================================================
# 3. mDNS / BONJOUR / CHROMECAST / AIRPLAY
# =============================================================================
# mDNS uses UDP 5353 and multicast 224.0.0.251.
# Devices discover each other via multicast queries.
#
# The rules below allow mDNS traffic between specific VLANs.
# Uncomment only what you need — broad mDNS forwarding leaks device info
# across VLANs (e.g. GUEST sees your printer).

# 3a. ALLOW mDNS one-way: MEAT can discover services on IOT
#     (MEAT → IOT query, IOT → MEAT response)
# -A FORWARD -p IPv4 --ip-src 10.60.23.0/24 --ip-dst 224.0.0.251 --ip-proto udp --ip-dport 5353 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.68.0.0/16 --ip-dst 10.60.23.0/24 --ip-proto udp --ip-sport 5353 -j ACCEPT

# 3b. ALLOW mDNS between MEAT and ANONYMOUS (both ways)
# -A FORWARD -p IPv4 --ip-src 10.60.23.0/24 --ip-dst 224.0.0.251 --ip-proto udp --ip-dport 5353 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.60.137.0/24 --ip-dst 224.0.0.251 --ip-proto udp --ip-dport 5353 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.60.23.0/24 --ip-dst 10.60.137.0/24 --ip-proto udp --ip-sport 5353 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.60.137.0/24 --ip-dst 10.60.23.0/24 --ip-proto udp --ip-sport 5353 -j ACCEPT

# 3c. ALLOW mDNS from a SPECIFIC DEVICE on IOT to MEAT
#     (e.g. a Chromecast on IOT that should appear on MEAT)
# -A FORWARD -p IPv4 --ip-src 10.68.0.50 --ip-dst 224.0.0.251 --ip-proto udp --ip-dport 5353 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.68.0.50 --ip-dst 10.60.23.0/24 --ip-proto udp --ip-sport 5353 -j ACCEPT

# 3d. BLOCK mDNS from GUEST entirely (can't discover anything)
#     (this already works because the base DROP rule blocks intra-VLAN traffic,
#      and mDNS multicast won't cross VLANs without explicit allow rules)

# =============================================================================
# 4. CROSS-VLAN ACCESS WITH mDNS (for devices that need discovery + connection)
# =============================================================================
# Some devices need both mDNS discovery AND TCP/UDP connection.
# Example: AirPlay speaker on IOT, accessed from MEAT.
#
# Step 1 — mDNS discovery (MEAT can see the speaker):
# -A FORWARD -p IPv4 --ip-src 10.60.23.0/24 --ip-dst 224.0.0.251 --ip-proto udp --ip-dport 5353 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.68.0.0/16 --ip-dst 10.60.23.0/24 --ip-proto udp --ip-sport 5353 -j ACCEPT
#
# Step 2 — data streaming (MEAT → speaker IP, speaker → MEAT):
# -A FORWARD -p IPv4 --ip-src 10.60.23.0/24 --ip-dst 10.68.0.50 -j ACCEPT
# -A FORWARD -p IPv4 --ip-src 10.68.0.50 --ip-dst 10.60.23.0/24 -j ACCEPT

# =============================================================================
# 5. COMPLETE ISOLATION (no exceptions)
# =============================================================================
# If a VLAN has EB_ENABLED=true with no ALLOW rules, clients can only
# reach the gateway. This is already handled by the provisioning script.
# No additional rules needed here.

# =============================================================================
# IMPORTANT NOTES
# =============================================================================
# - ebtables rules are session-only by default. Use 'apply-ebtables --save'
#   to persist them across reboots.
# - mDNS across VLANs requires BOTH the firewall rules AND the bridge to
#   forward multicast. The bridge with vlan_filtering=1 may need additional
#   configuration — if mDNS doesn't work after adding these rules, you may
#   need an mDNS reflector (avahi-daemon, mdns-repeater) instead.
# - The provisioning script's DROP rule blocks intra-VLAN client-to-client
#   traffic. Rules you add here come AFTER the provisioning rules, so they
#   can open exceptions but CANNOT override the DROP rule.
#   To insert BEFORE the DROP, use: apply-ebtables (then re-apply rules
#   in the correct order, or use -I with a specific rule number).
